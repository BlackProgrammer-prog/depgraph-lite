name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Rollup uses a platform-specific optional package for its native binary.
      - run: npm ci --include=optional
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Test the installable package
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/package-test"
          cd "$RUNNER_TEMP/package-test"
          npm init --yes
          npm install "$RUNNER_TEMP/depgraph-lite-0.1.0.tgz"
          npx --no-install depgraph-lite "$GITHUB_WORKSPACE/test/fixtures/basic" --json > "$RUNNER_TEMP/report.json"
          node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$RUNNER_TEMP/report.json"
